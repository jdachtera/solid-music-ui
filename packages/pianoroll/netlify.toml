# Set the site's base directory to this package (packages/<name>). Netlify then
# installs the whole pnpm workspace from the root and runs these from here.
#
# The site is the demo (dev/). It takes the workspace packages from their src/
# (the @solid-music-ui/source condition), so it needs no library build first.
[build]
command = "pnpm build-dev"
publish = "dev/dist"

# Otherwise a site builds with whatever Node it was created with.
[build.environment]
NODE_VERSION = "22"
